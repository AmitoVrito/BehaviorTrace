[project]
name = "behaviortrace"
version = "0.0.1"
description = "Evaluation harness for gradient-based training-data attribution in online RL (GRPO) fine-tuning."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Amit N." }]
keywords = [
    "rlhf", "data-attribution", "interpretability",
    "llm", "training-data-attribution", "grpo",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime deps. Pinned ranges; uv.lock holds the exact versions.
dependencies = [
    # Core ML - split torch by platform:
    # Intel macOS dropped from torch wheels after 2.2.2, but Colab Pro
    # is the actual training target, so dev installs on Intel Mac stay on 2.2.x
    # while Linux/ARM/Win pull modern torch.
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.3,<3.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers>=4.44,<5.0",
    "accelerate>=0.34,<2.0",
    "datasets>=2.21,<4.0",
    "peft>=0.12,<1.0",
    "bitsandbytes>=0.43,<1.0; platform_system != 'Darwin'",
    # RL training backend.
    # unpin trl - switching E1.1 from PPO to GRPO. GRPOTrainer requires
    # trl>=0.12. The legacy PPOTrainer (trl<0.12) produced unrecoverable KL
    # divergence (reaching -7.53) across 4 smoke runs; see .
    "trl>=0.12,<2.0",
    # Experiment tracking
    "wandb>=0.17,<1.0",
    # Config / CLI / utilities
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    # Numerics & data
    # numpy split by platform: torch 2.2.x (the Intel macOS pin above) predates NumPy 2 support,
    # so Intel macOS stays on numpy<2; every other platform gets torch>=2.3, which supports numpy 2.
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<3.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML",
    "ipykernel>=6.29,<7.0",
    "jupytext>=1.16,<2.0",
]

[project.scripts]
behaviortrace = "behaviortrace.cli:app"

[project.urls]
"Source" = "https://github.com/AmitoVrito/BehaviorTrace"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behaviortrace"]

# -- uv ----------------------------------------------------------------------

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "ipykernel>=6.29,<7.0",
    "jupytext>=1.16,<2.0",
]

# -- ruff --------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # long lines: docstrings reference long arXiv IDs
    "RUF001", # ambiguous unicode in identifiers (we don't use them in code)
    "RUF002", # ambiguous unicode in docstrings (×, →, ≤, etc. are intentional)
    "RUF003", # ambiguous unicode in comments
    "RUF005", # list concat vs unpack - minor preference
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"notebooks/**" = ["E402"]
# Typer requires function-call defaults for Option/Argument; B008 is a false positive there.
"src/behaviortrace/cli.py" = ["B008"]
"scripts/**" = ["B008"]

# -- mypy --------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/behaviortrace"]

# -- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: integration tests that require GPU or > 5min runtime",
    "colab: tests requiring Google Colab / Drive mount",
]
